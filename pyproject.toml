[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidxp"
version = "0.1.0"
authors = [
  { name = "Saad Bazaz", email = "saadbazaz@hotmail.com" },
]
description = "VidXP - Video indexing and search by dialogue, scene, and actor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["video", "search", "indexing", "cli", "streamlit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "accelerate",
  "audiofile>=0.0.0",
  "chromadb",
  "cmake",
  "decorator>=4.3.0",
  "dlib",
  "face_recognition",
  "hf_xet",
  "imageio>=2.5.0",
  "moviepy==1.0.3",
  "numpy==1.26.4",
  "opencv-python",
  "Pillow>=7.0.0",
  "pydub>=0.23.0",
  "pygame",
  "rich",
  "scipy>=1.3.0",
  "sentence-transformers",
  "streamlit",
  "torch",
  "typer",
  "tqdm>=4.0.0",
  "Unidecode>=1.3.6",
  "whisperx",
  "ply>=3.11",
  "PyYAML>=6.0",
  "clip @ git+https://github.com/openai/CLIP.git",
]

[project.scripts]
vidxp = "vidxp.main:main"

[project.urls]
Homepage = "https://universalpython.github.io"
Repository = "https://github.com/grayhatdevelopers/vix"
Issues = "https://github.com/grayhatdevelopers/vix/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vidxp"]
include-package-data = true

[tool.setuptools.package-data]
vidxp = []

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = false
tag_format = "v{version}"
build_command = "bash ./utils/build_package.sh"
commit_parser = "conventional"
major_on_zero = true
allow_zero_version = true
prerelease_token = "b"
changelog_file = "./CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "./CHANGELOG.md"
output_format = "md"

[tool.semantic_release.branches.release]
match = "release"
prerelease = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = true

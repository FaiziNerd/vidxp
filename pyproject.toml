[project]
name = "actordb"
version = "0.1.0"
description = "A Python package for video indexing and searching based on audio and scene content"
authors = [
    { name = "Abdullah Mansoor", email = "abdullahmansoor221@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<3.13"
dependencies = [
    "moviepy==1.0.3",
    "imageio>=2.5.0",
    "pygame",
    "decorator>=4.3.0,<5.0",
    "tqdm>=4.0.0",
    "Pillow>=7.0.0",
    "scipy>=1.3.0",
    "pydub>=0.23.0",
    "audiofile>=0.0.0",
    "opencv-python",
    "whisperx",
    "chromadb",
    "typer",
    "sentence-transformers",
    "clip @ git+https://github.com/openai/CLIP.git"
]

[project.scripts]
actordb = "actordb.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

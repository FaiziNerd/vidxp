name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "LICENSE"
      - "utils/build_package.sh"
      - "utils/build-requirements.txt"
      - "utils/fix_readme_links.py"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[scene,frontend,benchmarks]" build ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m unittest discover -s tests -q
        env:
          PYTHONPATH: src
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify minimal wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/python - <<'PY'
          from importlib.util import find_spec
          from subprocess import check_output

          import vidxp
          from vidxp.capabilities.registry import capability_names

          assert capability_names() == ("dialogue", "scene", "actor")
          help_text = check_output(
              [".wheel-smoke/bin/vidxp", "--help"],
              text=True,
          )
          assert "benchmark" not in help_text
          for module in (
              "chromadb",
              "clip",
              "cv2",
              "face_recognition",
              "sentence_transformers",
              "srt",
              "streamlit",
              "torch",
              "whisperx",
          ):
              assert find_spec(module) is None, module
          PY

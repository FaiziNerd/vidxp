name: Release (release → PyPI)

on:
  push:
    branches:
      - release
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "utils/build_package.sh"
      - "utils/build-requirements.txt"
      - "utils/fix_readme_links.py"

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build "python-semantic-release~=10.6.0"
          pip install -r utils/build-requirements.txt

      - name: Create stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version --commit --tag --push

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

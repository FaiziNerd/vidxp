name: Prerelease (main → TestPyPI)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "changes/**"
      - "LICENSE"
      - "MANIFEST.in"
      - "utils/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-to-test-pypi.yml"

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prerelease:
    needs: ci
    runs-on: ubuntu-latest
    environment: testpypi

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r utils/build-requirements.txt

      - name: Determine and tag prerelease version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version --as-prerelease --prerelease-token b --no-changelog

      - name: Publish to TestPyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

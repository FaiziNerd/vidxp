version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: UTC
    groups:
      compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: UTC
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
